name: release

# Builds an sdist plus manylinux wheels and publishes them to PyPI.
# Push a tag shaped like v*.*.* to run it, e.g.  git tag v0.1.1 && git push --tags
#
# Publishing uses PyPI *trusted publishing* (OIDC) so there is no token stored here:
# on PyPI, add a pending "trusted publisher" for this repo with
#   owner: tjandrasg   repository: kwcapture   workflow: .github/workflows/release.yml
# If you would rather use an API token, put a `pypi-...` token in the repository secret
# PYPI_API_TOKEN and switch the last step to `password: ${{ secrets.PYPI_API_TOKEN }}`.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev libwayland-dev pkg-config

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Build manylinux wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS: "x86_64"
          CIBW_SKIP: "*-musllinux_*"
          # the native helper needs these headers inside the manylinux image
          CIBW_BEFORE_ALL: "dnf install -y systemd-devel wayland-devel pkgconfig"
          # keep the compiled helper out of the wheel-until-setup.py puts it there
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
