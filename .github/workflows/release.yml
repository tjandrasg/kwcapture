name: release

# Push a tag shaped like v*.*.* to build an sdist + manylinux wheels and attach them to
# the GitHub release for that tag. Publishing to PyPI is opt-in for now: run this workflow
# manually ("Run workflow" -> publish: true) once the PyPI trusted publisher is set up
# (PyPI project -> Publishing -> Add trusted publisher: GitHub Actions,
#  owner tjandrasg, repository kwcapture, workflow file .github/workflows/release.yml).
# Without trusted publishing, use an API token in the repository secret PYPI_API_TOKEN and
# switch the last step to `password: ${{ secrets.PYPI_API_TOKEN }}`.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to PyPI"
        type: boolean
        default: false

permissions:
  contents: write   # create/update the GitHub release
  id-token: write   # PyPI trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (for the sdist)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev libwayland-dev pkg-config

      - name: Ring-reader tests (no compositor needed)
        # BUG-4 guardrail: the only automated coverage the zero-copy read path gets
        # outside a Plasma desktop. Run it before we ship anything built from this tree.
        run: |
          python -m pip install --quiet numpy
          python -X dev tests/test_ring_reader.py quick

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Build manylinux wheels
        # Do NOT pin an old cibuildwheel: each release pins a *dated* manylinux image
        # tag on quay.io and old tags get removed, so an old pin fails with
        # "No such image: quay.io/pypa/manylinux_2_28_x86_64:<old-date>" (this broke
        # the v0.1.0 and v0.2.0 release runs, which pinned 2.21.3 -> 2024.10.07-1).
        uses: pypa/cibuildwheel@v4.3.0
        env:
          # One build is enough and one build is all you can have: the helper is a
          # separate executable, not a Python extension module, so the wheel is
          # `py3-none-<platform>` and every interpreter would produce the SAME filename
          # (they silently overwrite each other in dist/). Any CPython >= 3.9 uses it.
          CIBW_BUILD: cp312-manylinux_x86_64
          # glibc 2.28 = RHEL/Alma 8 era; fine for any desktop running Plasma 6
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # the helper links sd-bus and wayland-client; EL images differ in package
          # manager and pkg-config package name, so try both
          CIBW_BEFORE_ALL_LINUX: >-
            (command -v dnf >/dev/null 2>&1 &&
             dnf install -y systemd-devel wayland-devel pkgconf-pkg-config) ||
            (command -v yum >/dev/null 2>&1 &&
             yum install -y systemd-devel wayland-devel pkgconfig)
          # deliberately do NOT vendor the compositor/system libraries into the wheel;
          # anyone running this is on a desktop that has them.
          # NOTE the placeholder is {dest_dir}, NOT {dest}: cibuildwheel 4.x leaves an
          # unknown {dest} alone, so auditwheel happily writes into a directory literally
          # named "{dest}" and then cibuildwheel fails with "the repair step completed
          # successfully but did not produce a wheel".
          CIBW_REPAIR_WHEEL_COMMAND: >-
            auditwheel repair
            --exclude libsystemd.so.0
            --exclude libwayland-client.so.0
            -w {dest_dir} {wheel}
          CIBW_BUILD_VERBOSITY: 1

      - name: Collect artefacts
        run: |
          cp -v wheelhouse/*.whl dist/
          ls -l dist/

      - name: Smoke-test a wheel
        run: |
          python -m venv /tmp/wheeltest
          # the repaired wheel is py3-none-manylinux_*_x86_64, there is no cpXYZ in the
          # name (see CIBW_BUILD above)
          ls -l dist/
          /tmp/wheeltest/bin/pip install --quiet dist/*-py3-none-manylinux*.whl numpy
          cd /tmp
          /tmp/wheeltest/bin/python -c "import kwcapture; print('wheel ok', kwcapture.__version__)"
          /tmp/wheeltest/bin/kwcapture --version

      - name: Attach to the GitHub release
        # only for tag pushes: a manual workflow_dispatch run (used to test the wheel
        # build, or to publish) would otherwise create a release named "main"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
