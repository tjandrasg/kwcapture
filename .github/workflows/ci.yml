name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev libwayland-dev pkg-config

      - name: Ring-reader tests (no compositor needed)
        # The deterministic half of BUG-4 (AGENTS.md): a synthetic ring, a writer thread
        # and the client's zero-copy reader. It runs here because the functional suite
        # needs a Plasma session and therefore never ran outside this desktop - which is
        # exactly why BUG-4 stayed invisible for three sessions.
        run: |
          python -m pip install --quiet numpy
          python -X dev tests/test_ring_reader.py quick

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the built wheel
        run: |
          python -m pip install --force-reinstall dist/kwcapture-*-py3-none-*.whl
          # run from OUTSIDE the checkout: otherwise the source tree shadows the
          # installed package and we would not be testing the wheel at all
          cd /tmp
          python -c "import kwcapture; print('import ok', kwcapture.__version__, kwcapture.__file__)"
          kwcapture --version
          kwcapture screens || echo "(no Wayland session in CI, as expected)"

      - name: Wheel contains the compiled helper
        run: |
          cd /tmp
          python - <<'PY'
          from kwcapture import _native
          p = _native.prebuilt_path()
          found = _native.find_binary()
          print("helper:", p, "exists:", p.is_file(), "selected:", found)
          assert p.is_file(), f"wheel did not ship the helper: {p}"
          assert p == found
          assert _native.binary_matches_arch(p), "helper arch does not match the runner"
          PY

      - name: Sdist builds and installs from scratch
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet dist/kwcapture-*.tar.gz
          cd /tmp
          /tmp/sdist-venv/bin/python - <<'PY'
          from kwcapture import _native
          p = _native.prebuilt_path()
          print("sdist install built the helper:", p.is_file(), p)
          assert p.is_file()
          PY

      - name: List artefacts
        run: ls -l dist/

  headless-kwin:
    # End-to-end capture against a *real* KWin with no GPU, no monitor and nobody logged in:
    # `kwin_wayland --virtual` on a private D-Bus session, driven by probe/nested_kwin_test.sh.
    # This is the only automated coverage the org.kde.KWin.ScreenShot2 path ever gets -- the
    # ring-reader job above cannot reach it, which is why whole classes of behaviour (window
    # handles, authorisation, the empty-session black frame) were only ever verified on one
    # developer desktop.
    #
    # Debian 13 (trixie) rather than ubuntu-latest because Plasma 6 is required: ubuntu-24.04
    # still ships KWin 5.27, whose window handles and ScreenShot2 flags are not what kwcapture
    # speaks (Plasma 6 hands out {uuid} window ids).
    name: headless KWin capture (Plasma 6, no GPU)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    env:
      XDG_RUNTIME_DIR: /tmp/xdg-run
      # No GPU on a runner: make sure a software GL exists and is chosen, rather than letting
      # KWin discover that its "configured compositor" (OpenGL) is unavailable.
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v4

      - name: Install KWin, D-Bus and the build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential pkg-config libsystemd-dev libwayland-dev libcap2-bin \
            libgl1-mesa-dri qt6-qpa-plugins \
            python3 python3-venv python3-pip \
            dbus dbus-x11 xkb-data \
            kwin-wayland kwin-common kcalc
          # Debian's postinst grants CAP_SYS_NICE to kwin_wayland so it can raise its scheduling
          # priority. A binary with file capabilities cannot be exec'd in a container running
          # with no-new-privileges -- which is how GitHub runs container jobs -- and every attempt
          # dies with `Operation not permitted`. KWin does not need the capability, so remove it.
          setcap -r /usr/bin/kwin_wayland
          echo "capabilities after setcap -r: '$(getcap /usr/bin/kwin_wayland)'"
          kwin_wayland --version 2>&1 | head -2
          # What the probe depends on, printed so a failure is not a mystery: /WindowsRunner comes
          # from kwin's krunnerintegration plugin, kcalc needs the wayland QPA plugin, and --virtual
          # needs some GL driver (llvmpipe here).
          echo "kwin plugins: $(ls /usr/lib/x86_64-linux-gnu/qt6/plugins/kwin/plugins/ 2>/dev/null | tr '\n' ' ')"
          echo "qt platforms: $(ls /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/ 2>/dev/null | tr '\n' ' ')"
          echo "dri drivers: $(ls /usr/lib/x86_64-linux-gnu/dri/ 2>/dev/null | tr '\n' ' ')"

      - name: Environment
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          command -v dbus-run-session
          command -v kcalc
          python3 -c "import sys; print('python', sys.version)"

      - name: Install kwcapture from this checkout
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --upgrade pip
          /tmp/venv/bin/pip install --quiet .
          /tmp/venv/bin/kwcapture --version
          # the nested KWin authorises the helper through this file, exactly like Plasma does
          /tmp/venv/bin/kwcapture install-desktop
          ls -l "${XDG_DATA_HOME:-$HOME/.local/share/applications}"/io.github.kwcapture-*.desktop

      - name: Capture a nested headless KWin
        # exits non-zero if the frame is the wrong size (wrong compositor), black while a window
        # is up, or if `doctor` regresses to failing an empty session
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          # NOT from the checkout: a cwd inside the tree puts ./kwcapture on sys.path ahead of
          # the installed package, and the source tree has no compiled helper -- doctor then
          # reports "helper not found" for a perfectly good install.
          cd /tmp
          dbus-run-session -- env PYTHON=/tmp/venv/bin/python \
            KWCAPTURE_NESTED_REQUIRE_WINDOW=1 \
            bash "$GITHUB_WORKSPACE/probe/nested_kwin_test.sh"
