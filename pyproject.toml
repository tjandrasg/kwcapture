[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kwcapture"
version = "0.6.0"
description = "Fast Wayland screen and window capture for KDE Plasma (KWin): ~40 fps at 1440p, per-window and per-monitor by name or id, measured fractional scaling, zero-copy Python API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tjandra Satria Gunawan" }]
keywords = [
    "wayland",
    "screenshot",
    "screen-capture",
    "window-capture",
    "kde",
    "plasma",
    "kwin",
    "numpy",
    "computer-use",
    "vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: KDE",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Typing :: Typed",
]
dependencies = ["numpy"]

[project.optional-dependencies]
fast = ["opencv-python-headless"]
pil = ["pillow"]

[project.scripts]
kwcapture = "kwcapture.__main__:main"

[project.urls]
Homepage = "https://github.com/tjandrasg/kwcapture"
Repository = "https://github.com/tjandrasg/kwcapture"
Issues = "https://github.com/tjandrasg/kwcapture/issues"

[tool.setuptools]
packages = ["kwcapture"]
include-package-data = true

[tool.setuptools.package-data]
kwcapture = ["native/*.c", "native/include/*.h", "bin/kwcapture", "py.typed"]
