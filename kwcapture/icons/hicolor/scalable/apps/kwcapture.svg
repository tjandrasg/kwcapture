<?xml version="1.0" encoding="UTF-8"?>
<!-- kwcapture mark: the monogram from kwcapture-mark-sketch.svg plus APTURE fitted
     inside the helper box that was drawn there.
     The box is a GUIDE and is NOT in this file. Its base set the baseline slope
     (-43.12 deg, read off the corner points) and its length/height set the type
     size: cap height 4.310 mm fills 100.0% of the box's length
     and 55.4% of its height, centred in the box.
     Re-run with the mark flag (see gen_logo.py); edit the box in the sketch, not here
     #kw       monogram, path data verbatim from the sketch
     #kw-c     the same path data again, clipped to the C the junction forms
     #a        the mouse pointer as the letter "A": cap height, capital-A width
     #wordmark "PTURE" as vector outlines
     Colour: the monogram is #008c46 and the C, the A and the letters are #7f7fff, so the
     mark reads KW (green) and Capture (blue). The C is a colour split, not a redraw: the
     geometry and the type fit are untouched by it
     Relative positions are exactly as sketched; the lockup is re-centred on the artboard
     (same scale, new translate). Sizing: fills the box.
     Reading: K+W junction = C, pointer = A, then PTURE  ->  CAPTURE.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="kwcapture">
  <title>kwcapture</title>
  <desc>A green K+W monogram whose junction is a blue letter C, a blue mouse pointer
 standing in for the letter A, then the blue letters PTURE: CAPTURE.</desc>
  <defs>
  </defs>
  <g id="logo" transform="translate(-576.8719 -1095.0049) scale(11.918)">
    <path id="kw" fill="#008c46" d="m 49.028894,100.35009 0.189293,29.44841 5.000829,-0.0144 -0.339319,-10.17088 7.164694,9.96979 4.885427,0.0411 4.459427,-5.42369 4.385166,5.52793 4.145952,-0.0701 7.33151,-8.39098 -3.37067,-3.29266 -5.924494,7.09621 L 70.496498,118 l -6.905781,7.7515 -7.045021,-10.21842 8.695069,-9.73961 -3.139284,-3.27979 -8.296045,9.14992 -0.119172,-11.27238"/>
    <path id="kw-c" fill="#7f7fff" d="M 53.8797,119.6132 L 61.0444,129.583 L 65.9298,129.6241 L 70.3892,124.2004 L 70.4965,118 L 63.5907,125.7515 L 56.5457,115.5331 L 65.2408,105.7935 L 62.1015,102.5137 L 53.8054,111.6636 Z"/>
    <g id="type" transform="translate(74.8452 121.4937) rotate(-43.1249) scale(1 1.753) rotate(43.1249) translate(-72.8288 -119.3409)">
      <!-- the pointer-A and PTURE together: stretched 1.753x across
           the baseline (never along it) to fill the box height, and
           seated on the box base line. The monogram is NOT in here -->
      <path id="a" fill="#7f7fff" transform="matrix(1.1642 -0.1871 -0.1871 1.1397 9.1209 -0.7221)" d="m 71.073358,111.19852 1.058879,4.6687 0.850315,-0.59361 -0.208567,-1.23536 1.18723,0.48131 0.738007,-0.59362"/>
      <g id="wordmark" transform="translate(75.4373 114.5169) rotate(-43.1249)">
        <path fill="#7f7fff" d="M0.336 0H1.357V-1.345H2.071C3.061 -1.345 3.671 -1.932 3.671 -2.821C3.671 -3.703 3.072 -4.31 2.1 -4.31H0.336ZM1.357 -2.152V-3.483H1.883C2.363 -3.483 2.612 -3.226 2.612 -2.821C2.612 -2.421 2.363 -2.152 1.886 -2.152Z M4.053 -3.477H5.358V0H6.376V-3.477H7.681V-4.31H4.053Z M10.024 0.055C11.109 0.055 11.844 -0.567 11.844 -1.53V-4.31H10.823V-1.614C10.823 -1.16 10.502 -0.836 10.024 -0.836C9.553 -0.836 9.229 -1.16 9.229 -1.614V-4.31H8.208V-1.53C8.208 -0.567 8.934 0.055 10.024 0.055Z M12.515 0H13.537V-1.484H14.092L14.882 0H16.001L15.102 -1.646C15.579 -1.86 15.851 -2.282 15.851 -2.878C15.851 -3.758 15.252 -4.31 14.28 -4.31H12.515ZM13.537 -2.291V-3.483H14.063C14.543 -3.483 14.792 -3.28 14.792 -2.878C14.792 -2.476 14.543 -2.291 14.066 -2.291Z M16.438 0H19.427V-0.833H17.46V-1.77H19.273V-2.586H17.46V-3.477H19.43V-4.31H16.438Z"/>
      </g>
    </g>
  </g>
</svg>
